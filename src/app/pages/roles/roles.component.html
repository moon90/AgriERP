<div class="page-container">
    <h2>Create New Role & Permissions</h2>
    <p class="subtitle">Define custom roles and assign specific module permissions.</p>

    <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="role-form">

        <div class="form-section">
            <div class="form-group">
                <label>Role Name <span class="required">*</span></label>
                <input type="text" formControlName="name" placeholder="e.g., Inventory Manager" class="form-control">
            </div>

            <div class="form-group">
                <label>Description</label>
                <input type="text" formControlName="description" placeholder="Brief description of the role" class="form-control">
            </div>
        </div>

        <h3 class="matrix-title">Permission Matrix</h3>

        <div class="permission-grid">
            @for (module of groupedModules; track module.moduleName) {
            <div class="module-card">
                <div class="module-header">{{ module.moduleName }} Module</div>
                <div class="permission-list">
                    @for (perm of module.permissions; track perm.code) {
                    <label class="checkbox-container">
                        <input type="checkbox" (change)="togglePermission(perm.code, $event)">
                        <span class="checkmark"></span>
                        <span class="perm-name">{{ perm.name }}</span>
                    </label>
                    }
                </div>
            </div>
            }
        </div>

        <div class="form-actions">
            <button type="submit" class="submit-btn" [disabled]="roleForm.invalid">Create Role</button>
        </div>

    </form>
</div>
