version: "3.8"

services:
  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_USER: agri_admin
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: AgriErpDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: