<div style="padding: 2rem; background-color: #f1f5f9; min-height: 100vh; font-family: 'Segoe UI', sans-serif; position: relative;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="color: #0f172a; margin: 0; font-size: 1.5rem; font-weight: 600;">Employee Management</h2>
        <button (click)="openModal()" style="background-color: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500;">
            + Add New Employee
        </button>
    </div>

    <div style="background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead style="background-color: #f8fafc; border-bottom: 2px solid #cbd5e1;">
                <tr>
                    <th style="padding: 16px; color: #334155; font-size: 14px;">Full Name</th>
                    <th style="padding: 16px; color: #334155; font-size: 14px;">Email Address</th>
                    <th style="padding: 16px; color: #334155; font-size: 14px;">Status</th>
                    <th style="padding: 16px; color: #334155; font-size: 14px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (user of users; track user.id) {
                <tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 16px; color: #0f172a; font-weight: 500;">{{ user.fullName }}</td>
                    <td style="padding: 16px; color: #475569;">{{ user.email }}</td>
                    <td style="padding: 16px;">
                        <span [ngStyle]="{'background-color': user.isActive ? '#dcfce7' : '#fee2e2', 'color': user.isActive ? '#166534' : '#991b1b', 'padding': '4px 12px', 'border-radius': '9999px', 'font-size': '12px', 'font-weight': '600'}">
                            {{ user.isActive ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                    <td style="padding: 16px;"><button style="background: #555; border: 1px solid #cbd5e1; padding: 4px 10px; cursor: pointer; border-radius: 4px;">Edit</button></td>
                </tr>
                }
            </tbody>
        </table>
    </div>

    @if (showModal) {
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: white; width: 450px; padding: 2rem; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="margin: 0; color: #0f172a;">Add New Employee</h3>
                <button (click)="closeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b;">&times;</button>
            </div>

            <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 14px; color: #475569; margin-bottom: 4px;">Full Name</label>
                    <input type="text" formControlName="fullName" placeholder="Enter full name"
                           style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 14px; color: #475569; margin-bottom: 4px;">Email Address</label>
                    <input type="email" formControlName="email" placeholder="email@farm.com"
                           style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 14px; color: #475569; margin-bottom: 4px;">Password</label>
                    <input type="password" formControlName="password" placeholder="Min 6 characters"
                           style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;margin-bottom: 1rem;">
                    <label style="font-weight: 600; color: #334155;">Assign Role <span style="color: #ef4444;">*</span></label>
                    <select formControlName="roleId" class="form-control" style="padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background-white: white;">
                        <option value="" disabled selected>-- Select a Role --</option>

                        @for (role of roles; track role.id) {
                        <option [value]="role.id">{{ role.name }}</option>
                        }
                    </select>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 1.5rem;">
                    <button type="submit" [disabled]="userForm.invalid"
                            [style.opacity]="userForm.invalid ? 0.6 : 1"
                            style="flex: 1; background-color: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                        Save Employee
                    </button>
                    <button type="button" (click)="closeModal()"
                            style="flex: 1; background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; cursor: pointer;">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
    }

</div>
